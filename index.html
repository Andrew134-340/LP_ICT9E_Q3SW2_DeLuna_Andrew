<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ICT Quiz#2</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(120deg, #2c3e50, #4ca1af);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            color: #2c3e50;
            text-align: center;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.2);
            width: 400px;
        }
        .btn-custom {
            width: 220px;
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
            margin: 5px;
            border: none;
            color: white;
        }
        .btn-success { background-color: #27ae60; }
        .btn-warning { background-color: #f39c12; }
        .btn-danger { background-color: #c0392b; }
        .btn-info { background-color: #2980b9; }
        .btn-custom:hover {
            transform: scale(1.05);
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
        }
        input.form-control {
            border-radius: 5px;
            padding: 8px;
            text-align: center;
            border: 2px solid #4ca1af;
        }
        h2 span {
            color: #2980b9;
            font-weight: bold;
        }
        .result-box {
            margin-top: 15px;
            padding: 10px;
            background-color: #2c3e50;
            border-radius: 5px;
            font-size: 18px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2><span>Mathematical Calculator</span></h2>
        <p>Feel free to test your math skills.</p>
        <form>
            <label>Enter a value for <b>a</b>:</label>
            <input type="number" id="num1" class="form-control" placeholder="Enter a value...">
            <br>
            <label>Enter a value for <b>b</b>:</label>
            <input type="number" id="num2" class="form-control" placeholder="Enter a value...">
            <br>
            <button type="button" class="btn btn-success btn-custom" onclick="multiply()">Product of a and b</button>
            <button type="button" class="btn btn-warning btn-custom" onclick="power()">a raised to b</button>
            <button type="button" class="btn btn-danger btn-custom" onclick="remainder()">Get the remainder</button>
            <button type="button" class="btn btn-info btn-custom" onclick="checkEqual()">Check if a is equal to b</button>
            <br><br>
            <div class="result-box" id="result">Answer: </div>
        </form>
    </div>
    
    <script>
        function multiply() {
            var a = document.getElementById("num1").value;
            var b = document.getElementById("num2").value;
            var result = Number(a) * Number(b);
            document.getElementById('result').innerHTML = 'Answer: ' + result;
        }
        
        function power() {
            var a = document.getElementById("num1").value;
            var b = document.getElementById("num2").value;
            var result = Math.pow(Number(a), Number(b));
            document.getElementById('result').innerHTML = 'Answer: ' + result;
        }
        
        function remainder() {
            var a = document.getElementById("num1").value;
            var b = document.getElementById("num2").value;
            var result = Number(a) % Number(b);
            document.getElementById('result').innerHTML = 'Answer: ' + result;
        }
        
        function checkEqual() {
            var a = document.getElementById("num1").value;
            var b = document.getElementById("num2").value;
            var result = (Number(a) === Number(b)) ? "Equal" : "Not Equal";
            document.getElementById('result').innerHTML = 'Answer: ' + result;
        }
    </script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
